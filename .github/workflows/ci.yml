# ci.yml: GitHub runs this on its own computer every time you push.
name: CI                                  # the name shown in the Actions tab and in gh run list

on:                                       # WHEN to run (the trigger)
  push:                                   # every push, to any branch
  pull_request:                           # and every pull request

jobs:                                     # WHAT to run: one or more jobs
  test:                                   # the job's id (you choose it)
    runs-on: ubuntu-latest                # a fresh Linux machine from GitHub, empty every time
    steps:                                # done in order; the first failing step stops the job
      - name: Check out the code
        uses: actions/checkout@v6         # a ready-made step: copy your repo onto the machine

      - name: Set up Python
        uses: actions/setup-python@v6     # another ready-made step: install a Python
        with:                             # settings for that step
          python-version: "3.15"          # in quotes, so YAML keeps it as text

      - name: Install tools
        run: python -m pip install pytest ruff   # run: = a shell command, like in your Terminal

      - name: Lint
        run: ruff check .                 # stage 1: cheap and fast

      - name: Test
        run: pytest -v                    # stage 2: exit code 1 here turns the run red

  build:
    needs: test  # wait for the test job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pack
        run: |
          mkdir -p dist 
          tar -czf dist/bump.tar.gz bump.py 
      - name: Distribute package
        uses: actions/upload-artifact@v6
        with:
          name: bump-package
          path: dist/bump.tar.gz
